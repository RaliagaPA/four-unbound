name: Firebase lobby rules tests
on:
  pull_request:
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/firebase-lobby-rules.yml'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules
